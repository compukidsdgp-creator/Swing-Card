name: Daily SwingScope update + Telegram

on:
  schedule:
    # 12:35 UTC = 18:05 IST: main run (sends once all 10 closes are in)
    - cron: "35 12 * * 1-5"
    # 14:45 UTC = 20:15 IST: retry - fills gaps from the NSE bhavcopy, sends if 18:05 couldn't,
    # alerts you if a trading day produced no data. Does nothing if 18:05 already sent.
    - cron: "45 14 * * 1-5"
  push:
    # uploading a new batch HTML (or notes) into inbox/ starts tracking right away
    paths:
      - "inbox/*.htm*"
      - "inbox/*.txt"
  workflow_dispatch:
    inputs:
      news:
        description: "Refresh news & sentiment"
        type: boolean
        default: true
      force_send:
        description: "Send to Telegram even if already sent / no new session"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: swingscope-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update closes, rebuild Excel/HTML, send to Telegram
        run: |
          ARGS="--telegram"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.news }}" = "true" ]; then ARGS="$ARGS --news"; fi
          if [ "${{ inputs.force_send }}" = "true" ]; then ARGS="$ARGS --force-send"; fi
          if [ "${{ github.event.schedule }}" = "45 14 * * 1-5" ]; then ARGS="$ARGS --final-attempt"; fi
          python update_daily.py $ARGS

      - name: Commit updated files
        run: |
          git config user.name  "swingscope-bot"
          git config user.email "swingscope-bot@users.noreply.github.com"
          git add -A data inbox
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily update $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash
            git push
          fi
